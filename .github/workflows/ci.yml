name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        rdkit-version: ["2024.3.5", "2024.9.6"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Select RDKit matrix version
        run: python -m pip install --no-deps --force-reinstall "rdkit==${{ matrix.rdkit-version }}"
      - run: python -m pip install -e .
      - run: python -m ruff check src tests examples data
      - run: python -m pytest -q
      - run: python examples/train_and_screen.py --plot artifacts/ci_parity.png
